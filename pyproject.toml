[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucdp-prio-acd"
version = "26.1.0"
description = "Reproducible analysis pipeline for the UCDP/PRIO Armed Conflict Dataset"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "seaborn>=0.13",
]

[project.scripts]
ucdp-acd = "ucdp_acd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]